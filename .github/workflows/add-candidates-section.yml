name: Add candidate experience section
on:
  push:
    paths:
      - '.github/workflows/add-candidates-section.yml'
permissions:
  contents: write
jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add candidate section
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text()

          css_old = '.arrow-box p{margin:0;color:var(--muted);font-size:14px}.about{display:grid;grid-template-columns:190px 1fr;gap:38px;align-items:start}'
          css_new = '.arrow-box p{margin:0;color:var(--muted);font-size:14px}.candidate-intro{max-width:820px}.candidate-intro p{color:var(--muted);font-size:17px;margin:22px 0 0}.candidate-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px 44px;margin-top:42px}.candidate-point{border-top:1px solid var(--line);padding-top:18px}.candidate-point h3{font-size:17px}.candidate-point p{color:var(--muted);margin:10px 0 0;font-size:14px}.candidate-close{margin-top:38px;padding:22px 24px;border-left:3px solid var(--red);background:rgba(217,39,53,.06)}.candidate-close p{margin:0;color:#fff;font-size:18px;font-weight:700;line-height:1.45}.candidate-actions{margin-top:24px}.about{display:grid;grid-template-columns:190px 1fr;gap:38px;align-items:start}'
          if css_old not in html:
              raise SystemExit('CSS insertion anchor not found')
          html = html.replace(css_old, css_new, 1)

          media_old = '@media(max-width:860px){.navin{min-height:92px}.logo{width:300px}.grid2{grid-template-columns:1fr;gap:38px}.credgrid{grid-template-columns:1fr 1fr}'
          media_new = '@media(max-width:860px){.navin{min-height:92px}.logo{width:300px}.grid2,.candidate-grid{grid-template-columns:1fr;gap:38px}.credgrid{grid-template-columns:1fr 1fr}'
          if media_old not in html:
              raise SystemExit('Responsive CSS anchor not found')
          html = html.replace(media_old, media_new, 1)

          nav_old = '<a href="#process">How We Work</a><a href="#testimonials">Testimonials</a>'
          nav_new = '<a href="#process">How We Work</a><a href="#candidates">Candidates</a><a href="#testimonials">Testimonials</a>'
          if nav_old not in html:
              raise SystemExit('Navigation anchor not found')
          html = html.replace(nav_old, nav_new, 1)

          about_anchor = '<section id="about"><div class="wrap about">'
          if about_anchor not in html:
              raise SystemExit('About section anchor not found')
          candidate_section = '''<section id="candidates"><div class="wrap"><div class="candidate-intro"><div class="eyebrow">For Candidates</div><h2>Your career deserves the same precision as the search.</h2><p>Whether you're an emerging technical professional, a senior engineer, a specialist or an executive, BullsEye! approaches every conversation with the same standard: understand the person before discussing the opportunity.</p><p>I don't believe in sending people into hiring processes simply because a few keywords match a job description. I take the time to understand what you've built, where you've had the greatest impact, what you're looking for next and whether the opportunity genuinely makes sense for you.</p></div><div class="candidate-grid"><div class="candidate-point"><h3>Relevant conversations</h3><p>I contact you because there is a credible reason to believe the opportunity aligns with your experience — not because a search string found a keyword.</p></div><div class="candidate-point"><h3>Straight answers</h3><p>You'll understand the role, the company, the expectations and the process as clearly as possible before investing your time.</p></div><div class="candidate-point"><h3>Respect for your time</h3><p>No unnecessary screening from me, no pushing opportunities that clearly aren't right and no treating your career like inventory.</p></div><div class="candidate-point"><h3>Technical understanding</h3><p>After more than 25 years recruiting technology professionals and leaders, the conversation goes beyond job titles and résumé keywords.</p></div><div class="candidate-point"><h3>Representation with precision</h3><p>When I introduce you to a client, I want them to understand the experience and capabilities that make you relevant to the problem they're trying to solve.</p></div><div class="candidate-point"><h3>Professional follow-through</h3><p>I stay involved through the process — from the first conversation through interviews, feedback, offer dynamics and close.</p></div></div><div class="candidate-close"><p>The objective isn't to put more people into hiring processes. It's to put the right people into the right conversations.</p></div><div class="candidate-actions"><a class="btn red" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=jponte%40bullseyehc.com&amp;su=Candidate%20conversation" target="_blank" rel="noopener">Open to the right opportunity? Talk to Jack</a></div></div></section>\n'''
          html = html.replace(about_anchor, candidate_section + about_anchor, 1)
          p.write_text(html)
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/add-candidates-section.yml
          git config user.name "ARROW Control Room"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/add-candidates-section.yml
          git commit -m "Add candidate experience section"
          git push origin main
