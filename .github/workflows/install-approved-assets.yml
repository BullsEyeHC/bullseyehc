name: Install approved website assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-approved-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact approved assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprcacentral.oaiusercontent.com/files/00000000-5ef8-820d-97a9-2c23e6b5112a/raw?se=2026-09-16T16%3A39%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=3dd3b1f3-d79c-5873-9444-08e3cf2f23b8&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A17%3A57Z&ske=2026-09-16T19%3A17%3A57Z&sks=b&skv=2026-02-06&sig=Bf4xecXxvLDn59FpouAf70epzKWyWSCMnnp%2B5%2BL2unk%3D' -o bullseye-approved-logo.png
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-c93c-8210-8aae-43156ea5b6b3/raw?se=2026-09-16T16%3A39%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=0c92b9cf-a1e6-5c90-b898-5b090f005515&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A20%3A33Z&ske=2026-09-16T19%3A20%3A33Z&sks=b&skv=2026-02-06&sig=Q3hyXz3TCwlqiE5kvQd20PV22AQ%2BSD9n0V7ZK0fke8w%3D' -o jack-ponte-approved.jpeg
          echo 'b652755ba18339857f8626ffdb904beee7ccd21d7e734aef5a54514a78a9370a  bullseye-approved-logo.png' | sha256sum -c -
          echo 'd16630b9aa420d4c35f5b257a25ab6e7434ce8367d54146869f41fb39a57b9bc  jack-ponte-approved.jpeg' | sha256sum -c -

      - name: Wire approved assets without crop or distortion
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          s = s.replace('bullseye-logo-fixed.png', 'bullseye-approved-logo.png')
          s = re.sub(r'(<img\s+class="portrait"\s+src=")[^"]+("[^>]*>)', r'\1jack-ponte-approved.jpeg\2', s)

          s = s.replace(
              '.logo{width:390px;height:auto;max-height:90px;display:block;object-fit:contain}',
              '.logo{width:390px;max-width:100%;height:auto;display:block;object-fit:contain}'
          )
          s = s.replace(
              '.portrait{display:block;width:190px;height:238px;object-fit:cover;object-position:center top;image-rendering:auto;filter:none}',
              '.portrait{display:block;width:190px;height:auto;object-fit:contain;object-position:center top;image-rendering:auto;filter:none}'
          )
          s = s.replace('.portrait{height:213px}', '.portrait{height:auto}')

          if 'bullseye-approved-logo.png' not in s:
              raise SystemExit('logo reference not installed')
          if 'jack-ponte-approved.jpeg' not in s:
              raise SystemExit('portrait reference not installed')
          if 'bullseye-logo-fixed.png' in s or 'jack-ponte-fixed.jpg' in s:
              raise SystemExit('stale image reference remains')
          if 'object-fit:cover' in s and 'class="portrait"' in s:
              raise SystemExit('portrait crop rule remains')

          p.write_text(s)

      - name: Remove one-time installer and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/install-approved-assets.yml
          git config user.name 'ARROW Control Room'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish exact approved BullsEye logo and portrait'
          git push origin HEAD:main
